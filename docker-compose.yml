services:
    kokunime:
        container_name: web
        build:
            context: .
            dockerfile: ./dockerfiles/production/Dockerfile
        image: kokunime:latest
        restart: always
        ports:
            - 3000:3000
        environment:
            - NODE_ENV=production
            # - NEXT_PUBLIC_SITE_URL=https://example.com
        healthcheck:
            test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000"]
            interval: 30s
            timeout: 5s
            retries: 3
            start_period: 20s
        deploy:
            resources:
                limits:
                    cpus: '0.5'
                    memory: 512M
        volumes:
            - next-cache:/app/.next/cache
volumes:
    next-cache:
