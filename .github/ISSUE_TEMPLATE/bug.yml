name: Bug report
description: Laporkan bug yang bisa direproduksi
title: "[bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Jangan sertakan token, cookie, data pribadi, atau URL admin. Untuk masalah keamanan, gunakan SECURITY.md.
  - type: textarea
    id: expected
    attributes:
      label: Yang diharapkan
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Yang terjadi
      description: Sertakan pesan error dan kode laporan diagnostik bila ada.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Langkah reproduksi
      placeholder: |
        1. Buka ...
        2. Klik ...
        3. Lihat ...
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Lingkungan
      description: Browser, perangkat, dan apakah terjadi di dev/produksi.
  - type: checkboxes
    id: checks
    attributes:
      label: Konfirmasi
      options:
        - label: Saya sudah mencari issue yang sama.
          required: true
        - label: Laporan ini tidak berisi token atau data pribadi.
          required: true
