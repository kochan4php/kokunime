name: Nightly cache integrity

on:
  schedule:
    # 02:23 UTC daily — validates the live cache/upstream wiring before peak hours.
    - cron: "23 2 * * *"
  workflow_dispatch:

jobs:
  integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate live cache integrity
        if: vars.PRODUCTION_URL != ''
        env:
          BASE: ${{ vars.PRODUCTION_URL }}
        run: node scripts/validate-cache.mjs

      # Release gate: production must absorb a quick burst inside budget.
      - name: Load gate (quick burst)
        if: vars.PRODUCTION_URL != ''
        env:
          BASE: ${{ vars.PRODUCTION_URL }}
        run: node scripts/load-test.mjs --mode=quick "$BASE/api/live"

      # Informational: finds where the budget starts breaking, never fails.
      - name: Load probe (breakpoint, informational)
        if: vars.PRODUCTION_URL != ''
        continue-on-error: true
        env:
          BASE: ${{ vars.PRODUCTION_URL }}
        run: node scripts/load-test.mjs --mode=breakpoint "$BASE/api/live"

      # Readiness under a burst is informational too: a 503 here means the
      # breaker opened mid-run (already covered by the gate above), not that
      # the probe is slow. The drill job gates on the 200↔503 semantics.
      - name: Readiness probe under burst (informational)
        if: vars.PRODUCTION_URL != ''
        continue-on-error: true
        env:
          BASE: ${{ vars.PRODUCTION_URL }}
        run: node scripts/load-test.mjs --mode=quick --routes=/api/live,/api/ready "$BASE"

      - name: Skip notice
        if: vars.PRODUCTION_URL == ''
        run: echo "::notice::PRODUCTION_URL belum diisi — job integritas cache dilewati."

      # SEO audit: same sitemap the indexer walks, validated for JSON-LD shape
      # per @type, OG image dimensions, canonical, and title/description hygiene.
      - name: Meta audit (strict)
        if: vars.PRODUCTION_URL != ''
        env:
          BASE: ${{ vars.PRODUCTION_URL }}
        run: node scripts/audit-meta.mjs --strict "$BASE" 60

      # IndexNow is a "tell search engines what changed" ping: only send it when
      # the live feed actually changed since the last ping (hash in cache).
      - name: Feed fingerprint
        id: feed
        if: vars.PRODUCTION_URL != ''
        env:
          BASE: ${{ vars.PRODUCTION_URL }}
        run: |
          HASH=$(curl -fsS --max-time 30 "$BASE/feed.xml" | sha256sum | cut -c1-16)
          echo "hash=$HASH" >> "$GITHUB_OUTPUT"
          mkdir -p .indexnow-state && echo "$HASH" > .indexnow-state/feed-hash

      - uses: actions/cache/restore@v4
        if: vars.PRODUCTION_URL != ''
        id: feed-cache
        with:
          path: .indexnow-state/feed-hash
          key: indexnow-feed-${{ steps.feed.outputs.hash }}

      # Rolling state of already-submitted URLs so only new/changed lastmods
      # are sent. restore-keys picks up the latest run's save.
      - uses: actions/cache/restore@v4
        if: vars.PRODUCTION_URL != '' && steps.feed-cache.outputs.cache-hit != 'true'
        with:
          path: .indexnow-state/submitted.json
          key: indexnow-submitted-${{ github.run_id }}
          restore-keys: |
            indexnow-submitted-

      - name: IndexNow ping (only URLs whose lastmod changed)
        if: vars.PRODUCTION_URL != '' && steps.feed-cache.outputs.cache-hit != 'true'
        env:
          SITE_URL: ${{ vars.PRODUCTION_URL }}
        run: node scripts/indexnow.mjs

      - uses: actions/cache/save@v4
        if: always() && vars.PRODUCTION_URL != '' && steps.feed-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        with:
          path: .indexnow-state/submitted.json
          key: indexnow-submitted-${{ github.run_id }}

      - name: Alert (optional webhook)
        if: failure()
        continue-on-error: true
        env:
          ALERT_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          ALERT_SOURCE: nightly
        run: node scripts/alert.mjs "Nightly gagal — cek integritas cache / load gate."

  staging-smoke:
    # Scheduled smoke on a locally built production stack: compose up + e2e full.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build and start the compose stack
        env:
          NEXT_PUBLIC_SITE_URL: http://localhost:3000
        run: docker compose up -d --build

      - name: Wait for app health
        run: |
          for i in $(seq 1 40); do
            if curl -fsS --max-time 5 http://localhost:3000/api/live >/dev/null 2>&1; then
              echo "stack up after $((i * 5))s"
              exit 0
            fi
            sleep 5
          done
          echo "::error::stack did not become healthy in time"
          docker compose logs --tail=120
          exit 1

      - name: E2E smoke (full)
        env:
          BASE_URL: http://localhost:3000
        run: node scripts/e2e-smoke.mjs

      - name: Compose logs on failure
        if: failure()
        run: docker compose logs --tail=200

      - name: Tear down
        if: always()
        run: docker compose down -v

      - name: Alert (optional webhook)
        if: failure()
        continue-on-error: true
        env:
          ALERT_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          ALERT_SOURCE: staging-smoke
        run: node scripts/alert.mjs "Staging smoke gagal — compose stack atau e2e full tidak lulus."

  docker-image:
    # Image size budget + hardening assertions on the production image.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build production image
        run: docker build -t kokunime:ci --build-arg NEXT_PUBLIC_SITE_URL=https://example.com .

      - name: Image size + hardening gate
        run: |
          SIZE_MB=$(( $(docker image inspect kokunime:ci --format '{{.Size}}') / 1024 / 1024 ))
          echo "image size: ${SIZE_MB} MB"
          if [ "$SIZE_MB" -gt 400 ]; then
            echo "::error::image size ${SIZE_MB} MB exceeds the 400 MB budget"
            exit 1
          fi

          USER_NAME=$(docker image inspect kokunime:ci --format '{{.Config.User}}')
          if [ "$USER_NAME" = "root" ] || [ -z "$USER_NAME" ]; then
            echo "::error::image runs as root (USER='${USER_NAME}')"
            exit 1
          fi

          if ! docker image inspect kokunime:ci --format '{{json .Config.Healthcheck}}' | grep -q "api/live"; then
            echo "::error::image has no /api/live healthcheck"
            exit 1
          fi

          docker image inspect kokunime:ci --format '{{json .Config.Env}}' | grep -q "NODE_ENV=production" || {
            echo "::error::NODE_ENV=production missing from image env"
            exit 1
          }

          echo "✓ size ${SIZE_MB} MB, non-root user '${USER_NAME}', healthcheck + NODE_ENV present"

      - name: Container smoke
        run: |
          docker run -d --name kokunime-ci -p 3000:3000 kokunime:ci
          for i in $(seq 1 20); do
            if curl -fsS --max-time 5 http://localhost:3000/api/live >/dev/null 2>&1; then
              echo "container healthy after $((i * 3))s"
              break
            fi
            sleep 3
          done
          curl -fsS --max-time 5 http://localhost:3000/api/live >/dev/null
          docker exec kokunime-ci id | grep -qv "uid=0" || { echo "::error::container process is root"; exit 1; }
          docker rm -f kokunime-ci
