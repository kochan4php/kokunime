name: Monitor

on:
  schedule:
    - cron: "*/15 * * * *" # uptime probe
    - cron: "0 */6 * * *" # e2e canary (also runs the uptime probe)
  workflow_dispatch:

concurrency:
  group: monitor
  cancel-in-progress: false

jobs:
  uptime:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '*/15 * * * *'
    runs-on: ubuntu-latest
    steps:
      - name: Probe production health
        if: vars.PRODUCTION_URL != ''
        env:
          BASE: ${{ vars.PRODUCTION_URL }}
        run: |
          fail() { echo "::error::$1"; echo "$1" >> "$GITHUB_STEP_SUMMARY"; exit 1; }

          # 1) Liveness + latency: does the app itself serve, fast?
          live_code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 "$BASE/api/live" || true)
          live_time=$(curl -s -o /dev/null -w "%{time_total}" --max-time 15 "$BASE/api/live" || true)
          echo "live: HTTP $live_code in ${live_time}s"

          # 2) Upstream-backed health (diagnostics endpoint).
          healthy=0
          for attempt in 1 2 3; do
            code=$(curl -s -o /tmp/health.json -w "%{http_code}" --max-time 20 "$BASE/api/health" || true)
            if [ "$code" = "200" ]; then healthy=1; break; fi
            echo "health attempt $attempt -> HTTP $code"
            sleep 20
          done

          # 3) Critical routes: the pages users actually hit must render.
          routes_failed=""
          for route in / /genres /seasons; do
            rcode=$(curl -s -o /dev/null -w "%{http_code}" --max-time 20 "$BASE$route" || true)
            echo "$route -> HTTP $rcode"
            [ "$rcode" = "200" ] || routes_failed="$routes_failed $route($rcode)"
          done

          # 4) TLS certificate days remaining.
          days_left=""
          HOST="$(printf '%s' "$BASE" | sed -E 's#^https?://##; s#/.*$##')"
          end_date="$(echo | timeout 15 openssl s_client -servername "$HOST" -connect "$HOST:443" 2>/dev/null | openssl x509 -noout -enddate 2>/dev/null | cut -d= -f2 || true)"
          if [ -n "$end_date" ]; then
            end_epoch="$(date -d "$end_date" +%s 2>/dev/null || true)"
            if [ -n "$end_epoch" ]; then
              days_left=$(( (end_epoch - $(date +%s)) / 86400 ))
            fi
          fi

          echo "live=$live_code latency=${live_time}s healthy=$healthy tls_days_left=${days_left:-unknown} routes_failed='${routes_failed}'" >> "$GITHUB_STEP_SUMMARY"

          [ "$live_code" = "200" ] || fail "liveness DOWN: HTTP $live_code"
          if [ -n "$live_time" ] && awk "BEGIN{exit !($live_time > 5)}"; then
            fail "liveness latency ${live_time}s > 5s threshold"
          fi
          [ "$healthy" = "1" ] || fail "health endpoint DOWN after 3 attempts"
          [ -z "$routes_failed" ] || fail "critical routes failing:$routes_failed"
          if [ -n "$days_left" ] && [ "$days_left" -lt 14 ]; then
            fail "TLS certificate expires in ${days_left} days"
          fi

          echo "probe OK"

      - name: Skip notice
        if: vars.PRODUCTION_URL == ''
        run: echo "PRODUCTION_URL repository variable not set - skipping uptime probe."

      - name: Alert Discord
        if: failure()
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
          BASE: ${{ vars.PRODUCTION_URL }}
        run: |
          [ -z "$WEBHOOK" ] && { echo "no DISCORD_WEBHOOK_URL secret"; exit 0; }
          curl -sf -X POST -H "Content-Type: application/json" \
            --data "{\"content\":\"Kokunime probe gagal di $BASE - cek step summary (liveness/health/tls/rute kritis).\"}" \
            "$WEBHOOK" || true

  canary:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 */6 * * *'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run smoke tests against production
        if: vars.PRODUCTION_URL != ''
        env:
          BASE_URL: ${{ vars.PRODUCTION_URL }}
        run: node scripts/e2e-smoke.mjs

      - name: Skip notice
        if: vars.PRODUCTION_URL == ''
        run: echo "PRODUCTION_URL repository variable not set - skipping canary."

      - name: Alert Discord
        if: failure()
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          [ -z "$WEBHOOK" ] && { echo "no DISCORD_WEBHOOK_URL secret"; exit 0; }
          curl -sf -X POST -H "Content-Type: application/json" \
            --data '{"content":"Kokunime canary gagal - e2e smoke test ke production tidak lulus. Cek scraper/upstream."}' \
            "$WEBHOOK" || true
