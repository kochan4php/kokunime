name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tag
        id: meta
        run: echo "tag=sha-$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            NEXT_PUBLIC_SITE_URL=${{ vars.PRODUCTION_URL }}
          tags: |
            ghcr.io/${{ github.repository }}:${{ steps.meta.outputs.tag }}
            ghcr.io/${{ github.repository }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-push
    if: vars.DEPLOY_HOST != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          HOST: ${{ vars.DEPLOY_HOST }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Ship compose files + ops scripts
        env:
          HOST: ${{ vars.DEPLOY_HOST }}
          USER: ${{ vars.DEPLOY_USER }}
          DIR: ${{ vars.DEPLOY_DIR }}
        run: |
          USER="${USER:-root}"
          DIR="${DIR:-/opt/kokunime}"
          ssh -i ~/.ssh/deploy_key "$USER@$HOST" "mkdir -p '$DIR'"
          scp -i ~/.ssh/deploy_key docker-compose.prod.yml docker-compose.canary.yml scripts/deploy.sh scripts/canary.sh "$USER@$HOST:$DIR/"
          # Seed for the canary nginx conf — never overwrites live state.
          scp -i ~/.ssh/deploy_key deploy/nginx/canary.conf "$USER@$HOST:$DIR/nginx-canary-seed.conf"

      - name: Run deploy (health-gated, auto-rollback)
        env:
          HOST: ${{ vars.DEPLOY_HOST }}
          USER: ${{ vars.DEPLOY_USER }}
          DIR: ${{ vars.DEPLOY_DIR }}
          TAG: ${{ needs.build-push.outputs.tag }}
        run: |
          USER="${USER:-root}"
          DIR="${DIR:-/opt/kokunime}"
          ssh -i ~/.ssh/deploy_key "$USER@$HOST" "cd '$DIR' && [ -f nginx-canary.conf ] || cp nginx-canary-seed.conf nginx-canary.conf; chmod +x deploy.sh canary.sh && ./deploy.sh '$TAG'"

      - name: Ping IndexNow (best effort)
        if: vars.PRODUCTION_URL != ''
        continue-on-error: true
        env:
          SITE_URL: ${{ vars.PRODUCTION_URL }}
        run: node scripts/indexnow.mjs

      - name: Canary smoke test (production)
        if: vars.PRODUCTION_URL != ''
        env:
          BASE_URL: ${{ vars.PRODUCTION_URL }}
        run: node scripts/e2e-smoke.mjs

      - name: Warm cache (top 50 URL, best effort)
        if: vars.PRODUCTION_URL != ''
        continue-on-error: true
        env:
          SITE_URL: ${{ vars.PRODUCTION_URL }}
        run: node scripts/warm-cache.mjs "$SITE_URL"

      - name: Alert on deploy failure
        if: failure()
        continue-on-error: true
        env:
          ALERT_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          ALERT_SOURCE: deploy
          TAG: ${{ needs.build-push.outputs.tag }}
        run: node scripts/alert.mjs "Deploy gagal (tag ${TAG}) — deploy.sh sudah mencoba auto-rollback, cek log job deploy."
