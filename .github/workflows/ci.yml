name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format check (biome)
        run: pnpm format:check

      - name: Lint (biome)
        run: pnpm lint

      - name: Unit tests (vitest)
        run: pnpm test

      - name: Production build
        run: pnpm build

      - name: Bundle budget
        run: node scripts/bundle-budget.mjs

      - name: Client-component audit (report only)
        run: node scripts/find-client-unnecessary.mjs

      - name: Unused-export audit (report only)
        run: node scripts/find-unused-exports.mjs

  container-smoke:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4

      - name: Build production image
        run: docker build -t kokunime-smoke .

      - name: Run container
        run: docker run -d --name kokunime-smoke -p 3000:3000 kokunime-smoke

      - name: Wait for liveness
        run: |
          for _ in $(seq 1 30); do
            if curl -fsS --max-time 5 http://localhost:3000/api/live >/dev/null 2>&1; then
              echo "container is live"
              exit 0
            fi
            sleep 2
          done
          echo "container never became live"
          docker logs kokunime-smoke
          exit 1

      - name: Smoke routes against the real container
        run: BASE_URL=http://localhost:3000 node scripts/e2e-smoke.mjs

      - name: Container logs on failure
        if: failure()
        run: docker logs kokunime-smoke
