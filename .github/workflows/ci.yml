name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Incremental build cache: PRs reuse the module graph from main.
      - name: Cache Next.js build cache
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: next-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('src/**/*', 'next.config.mjs', 'tsconfig.json') }}
          restore-keys: |
            next-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-

      - name: Format check (biome)
        run: pnpm format:check

      - name: Lint (biome)
        run: pnpm lint

      - name: Secret scan
        run: node scripts/scan-secrets.mjs

      - name: Dependency audit (prod)
        run: pnpm audit --prod --audit-level high

      - name: License check
        run: node scripts/check-licenses.mjs

      - name: Production build
        run: pnpm build

      - name: Bundle budget
        run: node scripts/bundle-budget.mjs

      - name: File-size budget
        run: node scripts/file-size-budget.mjs

      - name: Build artifact assertions
        run: node scripts/assert-artifact.mjs

      - name: Client-component audit (report only)
        run: node scripts/find-client-unnecessary.mjs

      - name: Unused-export audit (report only)
        run: node scripts/find-unused-exports.mjs

      - name: Untested-module audit (report only)
        run: node scripts/find-untested.mjs

  unit-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Unit tests (shard ${{ matrix.shard }}/2)
        run: pnpm vitest run --shard=${{ matrix.shard }}/2

  container-smoke:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4

      - name: Build production image
        run: docker build -t kokunime-smoke .

      - name: Run container
        run: docker run -d --name kokunime-smoke -p 3000:3000 kokunime-smoke

      - name: Wait for liveness
        run: |
          for _ in $(seq 1 30); do
            if curl -fsS --max-time 5 http://localhost:3000/api/live >/dev/null 2>&1; then
              echo "container is live"
              exit 0
            fi
            sleep 2
          done
          echo "container never became live"
          docker logs kokunime-smoke
          exit 1

      - name: Smoke routes against the real container
        run: BASE_URL=http://localhost:3000 node scripts/e2e-smoke.mjs

      - name: Offline smoke (service worker + saved page)
        run: BASE_URL=http://localhost:3000 node scripts/offline-smoke.mjs

      - name: Container logs on failure
        if: failure()
        run: docker logs kokunime-smoke
