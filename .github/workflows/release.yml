name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch: # jalankan "bump" untuk tag semver otomatis dari conventional commits

permissions:
  contents: write

jobs:
  bump:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Compute + write version bump
        run: node scripts/version-bump.mjs --write

      - name: Push commit + tag
        run: git push origin HEAD:"${GITHUB_REF_NAME}" --follow-tags

  notes:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate changelog
        run: node scripts/release-changelog.mjs

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" --title "${GITHUB_REF_NAME}" --notes-file CHANGELOG.md \
            || gh release edit "${GITHUB_REF_NAME}" --notes-file CHANGELOG.md
