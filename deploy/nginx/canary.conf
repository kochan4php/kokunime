# Seed for scripts/canary.sh — shipped to the deploy server as
# nginx-canary.conf (kept in sync with the script's writer). Canary disabled.

# Microcaching: identical SSR requests within 1s share one render.
proxy_cache_path /tmp/nginx-microcache levels=1:2 keys_zone=kokunime_micro:10m max_size=200m inactive=10m use_temp_path=off;

upstream kokunime_backend {
    server kokunime:3000 weight=10 max_fails=3 fail_timeout=15s;
    # canary disabled (scripts/canary.sh manages this line)
    keepalive 16;
}

server {
    listen 80;
    gzip on;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1024;

    location = /healthz {
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # APIs and admin never hit the microcache (mutations + per-token views).
    location /api/ {
        proxy_pass http://kokunime_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Start "${msec}";
        proxy_set_header Connection "";
        proxy_read_timeout 30s;
        proxy_connect_timeout 5s;
        proxy_cache off;
    }

    location / {
        proxy_pass http://kokunime_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Middleware reads this for real request age in sampled logs.
        proxy_set_header X-Request-Start "${msec}";
        proxy_set_header Connection "";
        proxy_read_timeout 30s;
        proxy_connect_timeout 5s;

        proxy_cache kokunime_micro;
        proxy_cache_valid 200 301 302 1s;
        proxy_cache_lock on;
        proxy_cache_use_stale updating error timeout;
        proxy_cache_background_update on;
        # Responses that set cookies (personalized) stay uncached by default.
        add_header X-Cache-Status $upstream_cache_status always;
    }
}
