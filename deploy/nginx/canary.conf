# Seed for scripts/canary.sh — shipped to the deploy server as
# nginx-canary.conf (kept in sync with the script's writer). Canary disabled.
upstream kokunime_backend {
    server kokunime:3000 weight=10 max_fails=3 fail_timeout=15s;
    # canary disabled (scripts/canary.sh manages this line)
}

server {
    listen 80;

    location = /healthz {
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    location / {
        proxy_pass http://kokunime_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Middleware reads this for real request age in sampled logs.
        proxy_set_header X-Request-Start "${msec}";
        proxy_read_timeout 30s;
        proxy_connect_timeout 5s;
    }
}
