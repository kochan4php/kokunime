# Canary overlay for docker-compose.prod.yml: runs a second app container plus
# an nginx that splits traffic by upstream weight.
#   docker compose -f docker-compose.prod.yml -f docker-compose.canary.yml up -d
# scripts/canary.sh manages start/abort/promote and rewrites ./nginx-canary.conf.
services:
  kokunime-canary:
    image: ghcr.io/kochan4php/kokunime:${KOKUNIME_CANARY_TAG:-latest}
    container_name: kokunime-canary
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - NEXT_PUBLIC_SITE_URL=${NEXT_PUBLIC_SITE_URL:-}
      - ERROR_WEBHOOK_URL=${ERROR_WEBHOOK_URL:-}
      - METRICS_TOKEN=${METRICS_TOKEN:-}
      - REDIS_URL=${REDIS_URL:-}
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/live"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  nginx:
    image: nginx:1.27-alpine
    container_name: kokunime-nginx
    restart: unless-stopped
    # Front door for the canary split; point your external proxy/load balancer
    # at this port (or publish it as 80 where free).
    ports:
      - "8080:80"
    volumes:
      - ./nginx-canary.conf:/etc/nginx/conf.d/kokunime.conf:ro
    depends_on:
      - kokunime
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
